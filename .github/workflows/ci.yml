name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLFLOW_TRACKING_URI: "https://dagshub.com/kianaaa19/SMSML_santanam.mlflow"
      MLFLOW_TRACKING_USERNAME: "kianaaa19"
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      # Trik sakral agar CLI patuh membuka backend store cloud
      MLFLOW_ALLOW_FILE_STORE: "true"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas xgboost scikit-learn python-dotenv

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Execute MLProject Production Training
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
        if [ -d "MLProject" ]; then cd MLProject; fi
        
        # Bersihkan sisa-sisa file store lokal lama
        rm -rf mlruns/ .mlflow/ MLmodel/ 2>/dev/null

        # KOREKSI UTAMA: Paksa MLflow CLI menggunakan database SQLite lokal agar sinkronisasi run tidak crash
        mlflow run . --env-manager=local --backend-store-uri sqlite:///mlflow.db

    - name: Fetch Latest Run ID via Python
      run: |
        python -c "
        import mlflow
        import os
        mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
        experiment = mlflow.get_experiment_by_name('Bank_Churn_Optimization_Santanam')
        runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id], order_by=['attributes.start_time DESC'], max_results=1)
        latest_run_id = runs.iloc[0]['run_id']
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f'LATEST_RUN_ID={latest_run_id}\n')
        print(f'[+] Sukses Mengunci Run ID Terbaru: {latest_run_id}')
        "

    - name: Build and Push Model Deployment Image
      run: |
        if [ -d "MLProject" ]; then cd MLProject; fi

        mlflow models build-docker \
          -m "runs:/${{ env.LATEST_RUN_ID }}/model" \
          -n "${{ secrets.DOCKERHUB_USERNAME }}/mlops-churn-app:latest"

        docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-churn-abc-app:latest
